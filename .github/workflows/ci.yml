name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Knip
        run: npm run knip

      - name: Bundle
        run: npm run bundle

      - name: Dry-run package
        run: npm pack --dry-run

  examples:
    name: Examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build examples
        run: npm run build:examples
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docs-site:
    name: Docs site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install docs dependencies
        run: npm ci --prefix docs-site

      - name: Bundle package
        run: npm run bundle

      - name: Typecheck docs site
        run: npm run site:typecheck

      - name: Build docs site
        run: npm run build --prefix docs-site
        env:
          BASE_PATH: /create-slot
          BASE_URL: https://r13v.github.io
