name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created || steps.retry.outputs.created }}
      tag: ${{ steps.release.outputs.tag_name || steps.retry.outputs.tag }}

    steps:
      - name: Run Release Please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v4

      - name: Reuse existing GitHub release
        id: retry
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable release tag such as v1.0.0, got: $RELEASE_TAG" >&2
            exit 1
          fi

          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Bundle
        run: npm run bundle

      - name: React-server boundary smoke
        run: npm run test:rsc

      - name: Chunk sharing smoke
        run: npm run test:chunks

      - name: Dry-run package
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --access public
